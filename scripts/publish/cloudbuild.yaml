steps:
  # Decrypt the SSH key.
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'kms',
        'decrypt',
        '--ciphertext-file=deploy_key.enc',
        '--plaintext-file=/root/.ssh/id_rsa',
        '--location=global',
        '--keyring=${_KEY_RING}',
        '--key=${_KEY_NAME}',
      ]

  # Decrypt the npm credentials.
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'kms',
        'decrypt',
        '--ciphertext-file=npmrc.enc',
        '--plaintext-file=npmrc',
        '--location=global',
        '--keyring=${_KEY_RING}',
        '--key=${_KEY_NAME}',
      ]

  # Set up git with key and domain.
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        chmod 600 /root/.ssh/id_rsa
        cat <<EOF >/root/.ssh/config
        Hostname github.com
        IdentityFile /root/.ssh/id_rsa
        EOF
        ssh-keyscan github.com >> /root/.ssh/known_hosts
  # Clone the repository.
  - name: 'gcr.io/cloud-builders/git'
    args: ['clone', 'git@github.com:${_REPOSITORY_ORG}/${_REPOSITORY_NAME}']

  # Set up the Git configuration.
  - name: 'gcr.io/cloud-builders/git'
    dir: '${_REPOSITORY_NAME}'
    args: ['config', '--global', 'user.email', 'firebase-oss-bot@google.com']
  - name: 'gcr.io/cloud-builders/git'
    dir: '${_REPOSITORY_NAME}'
    args: ['config', '--global', 'user.name', 'Google Open Source Bot']

  # Set up the npm credentials.
  - name: 'gcr.io/$PROJECT_ID/fft-package-builder'
    entrypoint: 'bash'
    args: ['-c', 'cp -v npmrc ~/.npmrc']

  # Publish the package to NPM or Exit Gate repository.
  - name: 'gcr.io/$PROJECT_ID/fft-package-builder'
    dir: '${_REPOSITORY_NAME}'
    args: ['bash', './scripts/publish.sh', '${_VERSION}', '${_USE_OSS_GATE}']
    secretEnv: ['GITHUB_TOKEN']
    env:
      - 'REPOSITORY_ORG=${_REPOSITORY_ORG}'
      - 'REPOSITORY_NAME=${_REPOSITORY_NAME}'
      - 'DRY_RUN=${_DRY_RUN}'

  # Only for Exit Gate deploys, copy manifest.json to GCS bucket to trigger publish.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    dir: "${_REPOSITORY_NAME}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ "${_USE_OSS_GATE}" = "true" ] && [ "${_DRY_RUN}" = "false" ]; then
          test -s manifest.json
          MANIFEST_NAME="manifest-fft-$(date +%Y%m%d%H%M%S).json"
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/firebase-functions-test/npm/manifests/$${MANIFEST_NAME}"
        else
          echo "Skipping OSS Exit Gate manifest upload (_USE_OSS_GATE=${_USE_OSS_GATE}, _DRY_RUN=${_DRY_RUN})."
        fi

options:
  volumes:
    - name: 'ssh'
      path: /root/.ssh

substitutions:
  _VERSION: ''
  _USE_OSS_GATE: 'false'
  _DRY_RUN: ''
  _KEY_RING: 'npm-publish-keyring'
  _KEY_NAME: 'publish'
  _REPOSITORY_ORG: 'firebase'
  _REPOSITORY_NAME: 'firebase-functions-test'

availableSecrets:
  secretManager:
    - versionName: projects/firebase-functions-publishing/secrets/firebase-functions-github-pat/versions/latest
      env: 'GITHUB_TOKEN'
